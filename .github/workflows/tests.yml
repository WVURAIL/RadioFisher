name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for unresolved conflict markers
        run: |
          # The {7} quantifiers keep this pattern from matching itself.
          pattern='^(<{7}|\|{7}|={7}|>{7})( |$)'
          set +e
          matches=$(git grep -nIE "$pattern" -- .)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$matches"
            echo "::error::Unresolved merge conflict markers are committed in the files listed above. Resolve the conflict and recommit."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::git grep failed unexpectedly (status $status)"
            exit 1
          fi
          echo "No conflict markers found."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Compile supported Python sources
        run: python -m compileall -q radiofisher tests chime2021/experiments_CHIME.py
      - name: Run component and numerical benches
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=json
      - name: Enforce coverage for every module
        run: python scripts/check_test_coverage.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel metadata
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import radiofisher; assert radiofisher.__version__ == '1.0.0'; assert radiofisher.BACKEND_API_VERSION == 1"
