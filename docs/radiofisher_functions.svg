<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1230" font-family="DejaVu Sans, sans-serif" role="img" aria-label="RadioFisher call graph: inputs, fisher(), the integrands and where the residual row is added">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1C2B39"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7F6310"/></marker></defs>
<rect width="1180" height="1230" fill="#F7F7F7"/>
<text x="24" y="34" font-size="19" fill="#1C2B39" font-weight="600" text-anchor="start" xml:space="preserve">RadioFisher: one redshift bin of a 21 cm BAO forecast</text>
<text x="24" y="56" font-size="13" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Main RadioFisher forecast path and the residual hook used by RFIsher (gold).</text>
<rect x="24" y="76" width="360" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="36" y="99" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">chime.py</text>
<text x="36" y="120" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">cosmo: Planck 2018, sigma_nl = 7 Mpc</text>
<text x="36" y="138" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">CHIME: 4 cylinders x 256 feeds, T_sys = 55 K,</text>
<text x="36" y="156" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">31,000 deg^2, 0.39 MHz channels, n(u) file,</text>
<text x="36" y="174" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">one year, BAO shift only</text>
<rect x="408" y="76" width="360" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="420" y="99" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">load_power_spectrum(cosmo, table)</text>
<text x="420" y="120" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">linear P(k) table at z = 0</text>
<text x="420" y="138" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">spline_pk_nobao: split into the smooth</text>
<text x="420" y="156" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">pk_nobao(k) and the BAO wiggles fbao(k)</text>
<rect x="792" y="76" width="364" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="804" y="99" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">background_evolution_splines(cosmo)</text>
<text x="804" y="120" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">H(z), r(z), D(z), f(z) as splines</text>
<text x="804" y="138" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">(Ez, fgrowth)</text>
<text x="804" y="156" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">passed on as cosmo_fns</text>
<line x1="204" y1="194" x2="204" y2="236" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="588" y1="194" x2="588" y2="236" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="974" y1="194" x2="974" y2="236" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="238" width="1132" height="720" rx="9" fill="#FFFFFF" stroke="#1C2B39" stroke-width="2.2"/>
<text x="42" y="266" font-size="16" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">fisher(zmin, zmax, cosmo, expt, cosmo_fns)</text>
<text x="42" y="286" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">returns F (one row and column per parameter) and the parameter names</text>
<rect x="44" y="302" width="1092" height="96" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="56" y="325" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">1  prepare_bin(zmin, zmax, cosmo, expt, cosmo_fns)</text>
<text x="56" y="346" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">band edges and center z; bandwidth = nu_21 / (1 + zmin) - nu_21 / (1 + zmax)</text>
<text x="56" y="364" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">load_interferom_file: baseline density n(u);  omega_HI(z), bias_HI(z) (castorina.py), Tb(z)</text>
<text x="56" y="382" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">D(z), f(z), r(z), r_nu = c (1+z)^2 / H(z);  Vfac = pi V / (2 pi)^3;  k and mu grids;  fbao_derivative</text>
<line x1="590" y1="398" x2="590" y2="436" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="438" width="1092" height="400" rx="8" fill="#F7F7F7" stroke="#1C2B39" stroke-width="1.5"/>
<text x="58" y="464" font-size="14.5" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">2  fisher_integrands(k, mu, cosmo, expt)</text>
<text x="58" y="484" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">at every Fourier mode (k, mu) of the grid</text>
<rect x="62" y="498" width="340" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="74" y="521" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Csignal (fiducial dilations)</text>
<text x="74" y="542" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">C_S = T_b^2 (b + f mu^2)^2</text>
<text x="74" y="560" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">  x exp(-k^2 mu^2 s_NL)</text>
<text x="74" y="578" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">  x (1 + A fbao) D^2 pk_nobao / (r^2 r_nu)</text>
<text x="74" y="596" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">HI signal; s_NL = sigma_nl^2 (Mpc^2)</text>
<rect x="420" y="498" width="340" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="432" y="521" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Cnoise</text>
<text x="432" y="542" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">T_sys^2 S_area / (n_pol t_tot nu_21)</text>
<text x="432" y="560" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">x lambda^4 / [N_beam (A_eff theta_b)^2]</text>
<text x="432" y="578" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">x interferometer_response(q, y)</text>
<text x="432" y="596" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">cuts: low |k_par| and high |k|</text>
<rect x="778" y="498" width="340" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="790" y="521" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Cfg</text>
<text x="790" y="542" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">foreground power x epsilon_fg^2</text>
<text x="790" y="560" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">= 0 for CHIME here</text>
<rect x="62" y="632" width="1056" height="40" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="74" y="655" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">C_tot = C_S + C_N + C_FG</text>
<line x1="232" y1="616" x2="232" y2="630" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="590" y1="616" x2="590" y2="630" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="948" y1="616" x2="948" y2="630" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="62" y="690" width="640" height="132" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="74" y="713" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">one row per parameter</text>
<text x="74" y="734" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">d_i = (d ln C_S / d theta_i) x C_S / C_tot</text>
<text x="74" y="752" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">A, b_HI, Tb, s_NL, sigma8tot, n_s, f, fs8, bs8, pk</text>
<text x="74" y="770" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">aperp, apar: the BAO shift term, through dfbao_dk</text>
<text x="74" y="788" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">(logpk_derivative feeds the switched-off terms)</text>
<rect x="722" y="690" width="396" height="132" rx="7" fill="#F0ECE2" stroke="#7F6310" stroke-width="2.2"/>
<text x="734" y="713" font-size="14" fill="#7F6310" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">expt['P_res']  -&gt;  row '_Pres'</text>
<text x="734" y="734" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">d_res = dP(k, mu, C_N, C_S) / C_tot</text>
<text x="734" y="752" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Integration gives the bias projection B.</text>
<text x="734" y="770" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Parameter bias = inverse(F_fit) B.</text>
<text x="734" y="788" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">The residual stays outside C_tot.</text>
<line x1="400" y1="672" x2="400" y2="688" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="920" y1="672" x2="920" y2="688" stroke="#7F6310" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="590" y1="838" x2="590" y2="860" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="862" width="1092" height="78" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="56" y="885" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">3  integrate_fisher_elements(derivs, k, mu)</text>
<text x="56" y="906" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">F_ij = Vfac x Int Int k^2 d_i d_j dk dmu   (integrate_grid: Simpson rule over the grid)</text>
<text x="56" y="924" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Alternative: quadrature.integrate_segments uses paired nodes; prepare_bin supports the direct BAO derivative</text>
<rect x="24" y="972" width="1132" height="58" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="36" y="995" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Shared instrument.py and baselines.py helpers</text>
<text x="36" y="1016" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">wavelength, collecting area, mode cuts; CHIME all-pair and inter-cylinder baseline densities</text>
<rect x="24" y="1048" width="1132" height="138" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="36" y="1071" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">4  summarize_fisher(F, names, parameters)</text>
<text x="36" y="1092" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Caller selects fitted parameters; omitted parameters stay fixed. The residual is excluded from the fit.</text>
<text x="36" y="1110" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Conditioned solve: covariance = inverse(F_fit); bias = inverse(F_fit) B; sigma = sqrt(diag(covariance)).</text>
<text x="36" y="1128" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">FisherResult holds names, Fisher block, bias projection, covariance, bias, sigma and condition.</text>
<text x="36" y="1146" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">result.project(J, names): derived covariance = J covariance J.T; derived bias = J bias.</text>
<text x="36" y="1164" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">RFIsher supplies the DTV model, integration boundary, fit choices, D_V weights, and tolerance reporting.</text>
</svg>
