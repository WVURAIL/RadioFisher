[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiofisher"
dynamic = ["version"]
description = "Fisher forecast for 21 cm BAO with a cylinder interferometer (the CHIME path of RadioFisher)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Philip Bull"}]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/WVURAIL/RadioFisher"

[tool.setuptools]
packages = ["radiofisher"]

[tool.setuptools.dynamic]
version = {attr = "radiofisher.__version__"}

[tool.setuptools.package-data]
radiofisher = ["data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
